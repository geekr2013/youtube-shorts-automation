name: Daily Hana Pilates Short

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-upload.yml'
      - 'requirements.txt'
      - 'src/**'
      - 'tests/**'
      - 'assets/instructor/**'
      - 'data/launch_request.json'
  schedule:
    # US evening overlap: 20:35-21:35 Eastern / 17:35-18:35 Pacific
    - cron: '35 1 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '영상만 만들고 YouTube에는 올리지 않기'
        required: false
        default: false
        type: boolean
      candidate_review:
        description: '업로드 없이 실제 영상 후보 화면표만 만들기'
        required: false
        default: false
        type: boolean
      curated_preview:
        description: '사람이 화면표로 확인한 소스로 미리보기 만들기'
        required: false
        default: false
        type: boolean
      model_candidate_source_ids:
        description: '새 고정 모델 검수용 Pexels ID 또는 범위'
        required: false
        default: ''
        type: string
      model_candidate_query:
        description: '새 고정 모델 후보 검색어(업로드 없음)'
        required: false
        default: ''
        type: string
      model_candidate_creator:
        description: '검수할 Pexels 업로더 이름'
        required: false
        default: ''
        type: string
      model_candidate_render:
        description: '일치 소스의 동작 화면표도 생성'
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: write

concurrency:
  group: daily-hana-pilates-short
  cancel-in-progress: false

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      YOUTUBE_DATA_API_KEY: ${{ secrets.YOUTUBE_DATA_API_KEY }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
      GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
      RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
      YOUTUBE_PRIVACY: public
      CONTENT_LANGUAGE: en
      TARGET_REGION: US
      TTS_LOCALE: en-US

    steps:
      - name: 저장소 준비
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Python 준비
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip

      - name: 검증 영상 선택
        id: preview
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-preview]') }}
        run: |
          python -c "import json; print('run_id=' + str(json.load(open('data/launch_request.json', encoding='utf-8'))['preview_run_id']))" >> "$GITHUB_OUTPUT"

      - name: 검증 영상 받기
        if: ${{ steps.preview.outcome == 'success' }}
        uses: actions/download-artifact@v8
        with:
          name: short-preview-${{ steps.preview.outputs.run_id }}
          path: data/preview-promotion
          github-token: ${{ github.token }}
          run-id: ${{ steps.preview.outputs.run_id }}

      - name: 영상 도구 설치
        run: |
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ffmpeg fonts-lato
          ffmpeg -version | head -n 1
          fc-match 'Lato'

      - name: Python 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 자동 검사
        run: |
          python -m compileall -q src
          python -m unittest discover -s tests -v

      - name: 실제 영상 후보 화면표 만들기
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_review == true }}
        run: python src/candidate_review.py

      - name: 새 고정 모델 후보 검수
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.model_candidate_source_ids != '' || inputs.model_candidate_query != '') }}
        env:
          MODEL_CANDIDATE_SOURCE_IDS: ${{ inputs.model_candidate_source_ids }}
          MODEL_CANDIDATE_QUERY: ${{ inputs.model_candidate_query }}
          MODEL_CANDIDATE_CREATOR: ${{ inputs.model_candidate_creator }}
          MODEL_CANDIDATE_RENDER: ${{ inputs.model_candidate_render }}
        run: python src/model_candidate_review.py

      - name: 영상 생성만 테스트
        id: dry_run
        if: ${{ (github.event_name == 'push' && !contains(github.event.head_commit.message, '[launch-upload]') && !contains(github.event.head_commit.message, '[publish-preview]')) || (github.event_name == 'workflow_dispatch' && inputs.dry_run == true && inputs.candidate_review != true && inputs.model_candidate_source_ids == '' && inputs.model_candidate_query == '') }}
        env:
          CURATED_PREVIEW: ${{ inputs.curated_preview }}
        run: python src/main.py --dry-run

      - name: 영상 생성 및 공개 업로드
        id: upload
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.dry_run != true && inputs.candidate_review != true && inputs.model_candidate_source_ids == '' && inputs.model_candidate_query == '') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[launch-upload]')) }}
        run: python src/main.py

      - name: 검증 영상 공개 업로드
        id: preview_upload
        if: ${{ steps.preview.outcome == 'success' }}
        env:
          PREVIEW_RUN_ID: ${{ steps.preview.outputs.run_id }}
        run: python src/publish_preview.py data/preview-promotion

      - name: 실행 상태 작성
        if: always()
        env:
          RUN_EVENT: ${{ github.event_name }}
          DRY_RUN_REQUESTED: ${{ inputs.dry_run }}
          DRY_RUN_OUTCOME: ${{ steps.dry_run.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
          PREVIEW_UPLOAD_OUTCOME: ${{ steps.preview_upload.outcome }}
          RUN_ID: ${{ github.run_id }}
          RUN_SHA: ${{ github.sha }}
        run: python src/run_status.py

      - name: 운영 기록 저장
        if: ${{ always() && github.ref == 'refs/heads/main' }}
        run: |
          git config user.email "action@github.com"
          git config user.name "Hana Pilates Bot"
          git add data/published_topics.json data/automation_status.json
          git diff --cached --quiet || git commit -m "Update Shorts performance data [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: 확인용 결과 보관
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: short-preview-${{ github.run_id }}
          path: |
            data/work/metadata.json
            data/work/render/final_short.mp4
            data/work/render/contact-sheet.jpg
            data/candidate-review/candidates.json
            data/candidate-review/**/*.jpg
            data/model-candidate-review/candidates.json
            data/model-candidate-review/**/*.jpg
          if-no-files-found: ignore
          retention-days: 3

